<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — Lumina Living</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <header class="header">
    <div class="container header__container">
      <a href="index.html" class="logo">Lumina Living</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Главная</a>
        <a href="index.html#catalog" class="nav__link">Каталог</a>
        <a href="index.html#about" class="nav__link">О бренде</a>
      </nav>

      <a href="profile.html" class="icon-btn active" id="auth-btn" aria-label="Профиль">
        <i class="fa-solid fa-user" id="auth-icon"></i>
      </a>
    </div>
    </div>
  </header>

  <!-- Страница Личного Кабинета -->
  <main class="profile-page">
    <div class="container">
      <div class="profile-layout">

        <aside class="profile-sidebar">
          <div class="profile-avatar-box">
            <div class="profile-avatar">
              <i class="fa-solid fa-user"></i>
            </div>
            <h2 class="profile-name" id="profile-user-name">Загрузка...</h2>
            <p class="profile-email" id="profile-user-email">email@example.com</p>
          </div>

          <nav class="profile-menu">
            <button class="profile-menu__item active" data-tab="orders">
              <i class="fa-solid fa-box"></i> Мои заказы
            </button>
            <button class="profile-menu__item" data-tab="settings">
              <i class="fa-solid fa-gear"></i> Настройки профиля
            </button>
            <button class="profile-menu__item profile-menu__item--logout" id="profile-logout-btn">
              <i class="fa-solid fa-right-from-bracket"></i> Выйти из аккаунта
            </button>
          </nav>
        </aside>

        <section class="profile-content">

          <!-- Таб 1: Мои заказы -->
          <div class="profile-tab active" id="tab-orders">
            <h1 class="profile-title">История заказов</h1>
            <div class="orders-list" id="orders-container">
              <div class="profile-empty-state">
                <i class="fa-solid fa-receipt"></i>
                <p>У вас пока нет оформленных заказов</p>
                <a href="index.html#catalog" class="btn btn--primary" style="margin-top: 16px;">Перейти в каталог</a>
              </div>
            </div>
          </div>

          <!-- Таб 2: Настройки профиля -->
          <div class="profile-tab" id="tab-settings">
            <h1 class="profile-title">Настройки аккаунта</h1>

            <form id="settings-form" class="profile-form" style="margin-bottom: 40px;">
              <h3 style="font-size: 18px; margin-bottom: 16px;">Личные данные</h3>
              <div class="form-group">
                <label for="settings-name">ФИО / Имя</label>
                <input type="text" id="settings-name" class="form-control" placeholder="Ваше имя" required>
              </div>
              <div class="form-group">
                <label for="settings-phone">Номер телефона</label>
                <input type="tel" id="settings-phone" class="form-control" placeholder="+7 (999) 000-00-00">
              </div>
              <div class="form-group">
                <label for="settings-email">Email</label>
                <input type="email" id="settings-email" class="form-control" disabled
                  style="background-color: #f5f5f7; cursor: not-allowed;">
              </div>
              <button type="submit" class="btn btn--primary" style="align-self: flex-start; margin-top: 8px;">
                Сохранить изменения
              </button>
            </form>

            <form id="password-form" class="profile-form">
              <h3 style="font-size: 18px; margin-bottom: 16px;">Изменение пароля</h3>
              <div class="form-group">
                <label for="old-password">Текущий пароль</label>
                <input type="password" id="old-password" class="form-control" placeholder="••••••••" required>
              </div>
              <div class="form-group">
                <label for="new-password">Новый пароль</label>
                <input type="password" id="new-password" class="form-control" placeholder="Минимум 6 символов"
                  minlength="6" required>
              </div>
              <button type="submit" class="btn btn--outline" style="align-self: flex-start; margin-top: 8px;">
                Обновить пароль
              </button>
            </form>
          </div>

        </section>

      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="profile.js"></script>
</body>

</html>
